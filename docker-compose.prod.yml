version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: scrolith-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - scrolith-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: scrolith-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "5000:5000"
    volumes:
      - ./geezle-backend/uploads:/app/geezle-backend/uploads

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_PUBLIC_APP_DOMAIN: ${VITE_PUBLIC_APP_DOMAIN}
    container_name: scrolith-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  scrolith-postgres-data:
