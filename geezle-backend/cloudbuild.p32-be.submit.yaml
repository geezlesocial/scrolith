# Phase 32.5 — Production backend (Notification Center 32.0–32.4)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -f,
        Dockerfile.storyfix.runtime,
        --no-cache,
        -t,
        asia-southeast1-docker.pkg.dev/scrolith-500821/scrolith/scrolith-backend:p32,
        --label,
        phase=32,
        --label,
        feature=phase32-notification-center,
        .
      ]
images:
  - asia-southeast1-docker.pkg.dev/scrolith-500821/scrolith/scrolith-backend:p32
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 2400s
