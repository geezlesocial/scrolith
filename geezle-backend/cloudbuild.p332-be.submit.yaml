# Phase 33.2 — Production backend (Scrolitha AI intelligence + discovery)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -f,
        Dockerfile.storyfix.runtime,
        --no-cache,
        -t,
        asia-southeast1-docker.pkg.dev/scrolith-500821/scrolith/scrolith-backend:p332,
        --label,
        phase=33.2,
        --label,
        feature=phase332-scrolitha-intelligence,
        .
      ]
images:
  - asia-southeast1-docker.pkg.dev/scrolith-500821/scrolith/scrolith-backend:p332
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 2400s
