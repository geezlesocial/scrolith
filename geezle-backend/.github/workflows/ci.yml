name: CI

on:
  push:
    # allow running on any branch so feature branches trigger CI
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]
  # allow manual dispatch from the Actions UI or `gh workflow run`
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://scrolith_test:local_test_password@127.0.0.1:5432/scrolith_test
      SHADOW_DATABASE_URL: postgresql://scrolith_test:local_test_password@127.0.0.1:5432/scrolith_shadow
    strategy:
      matrix:
        node-version: [22.18.0]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scrolith_test
          POSTGRES_PASSWORD: local_test_password
          POSTGRES_DB: scrolith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scrolith_test -d scrolith_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Create isolated shadow database
        env:
          PGPASSWORD: local_test_password
        run: |
          psql --host=127.0.0.1 --username=scrolith_test --dbname=postgres --command="CREATE DATABASE scrolith_shadow OWNER scrolith_test;"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate and apply isolated Prisma migrations
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --script

      - name: Run test suite
        env:
          CI: true
        run: npm run test:full

      - name: Build backend
        run: npm run build

      - name: Check patch formatting
        run: git diff --check

      - name: Build backend Docker image
        run: docker build --file Dockerfile.acr.temp --tag scrolith-backend:prisma7-ci .

      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --registry=https://registry.npmjs.org --omit=dev --json > audit-production.json
          audit_status=$?
          set -e
          node scripts/summarize-audit.mjs audit-production.json
          printf '%s\n' "$audit_status" > audit-production.exit

      - name: Full dependency audit
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --registry=https://registry.npmjs.org --json > audit-full.json
          audit_status=$?
          set -e
          node scripts/summarize-audit.mjs audit-full.json
          printf '%s\n' "$audit_status" > audit-full.exit

      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-audit-${{ github.sha }}
          path: |
            audit-production.json
            audit-production.exit
            audit-full.json
            audit-full.exit
          if-no-files-found: error

      - name: Remove audit artifacts
        if: always()
        run: true
