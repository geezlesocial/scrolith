name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'geezle-backend/docs/**'

  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'geezle-backend/docs/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd geezle
          npm ci

      - name: Build frontend
        run: |
          cd geezle
          npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: geezle/dist

      - name: Run frontend unit tests
        run: |
          cd geezle
          npm test --if-present
        env:
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Run Cypress E2E (optional)
        if: ${{ secrets.BACKEND_URL != '' }}
        run: |
          cd geezle
          # Cypress should be installed as a devDependency; run tests against provided BACKEND_URL
          npx cypress run --config baseUrl=${{ secrets.BACKEND_URL }} || true
        env:
          CYPRESS_apiUrl: ${{ secrets.BACKEND_URL }}
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Upload Cypress artifacts (videos/screenshots)
        if: ${{ secrets.BACKEND_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            geezle/cypress/videos
            geezle/cypress/screenshots
            geezle/cypress/results || geezle/cypress/report

      - name: Configure AWS credentials
        if: ${{ secrets.S3_BUCKET != '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync frontend build to S3
        if: ${{ secrets.S3_BUCKET != '' }}
        run: |
          aws s3 sync geezle/dist s3://${{ secrets.S3_BUCKET }} --delete --acl public-read --cache-control "public, max-age=31536000, immutable"
          # Ensure index.html is not aggressively cached
          aws s3 cp geezle/dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html --cache-control "no-cache, no-store, must-revalidate" --acl public-read

      - name: Invalidate CloudFront cache
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
