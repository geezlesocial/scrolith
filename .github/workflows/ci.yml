name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'geezle-backend/docs/**'

  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'geezle-backend/docs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Secrets used by conditional steps are exposed through job-level
      # environment variables so conditions can safely use env.*.
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_ACCESS_KEY_ID_VALUE: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_VALUE: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        shell: bash
        env:
          VITE_BACKEND_URL: ${{ env.BACKEND_URL }}
        run: |
          # Pull-request compilation must not depend on a real production
          # backend endpoint.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -z "$VITE_BACKEND_URL" ]; then
            export VITE_BACKEND_URL="https://backend.invalid"
          fi

          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error

      - name: Run frontend unit tests
        shell: bash
        env:
          VITE_BACKEND_URL: ${{ env.BACKEND_URL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -z "$VITE_BACKEND_URL" ]; then
            export VITE_BACKEND_URL="https://backend.invalid"
          fi

          npm test --if-present

      - name: Run Cypress E2E (optional)
        if: ${{ env.BACKEND_URL != '' }}
        shell: bash
        env:
          CYPRESS_apiUrl: ${{ env.BACKEND_URL }}
          VITE_BACKEND_URL: ${{ env.BACKEND_URL }}
        run: |
          # Cypress is optional and requires a configured backend target.
          npx cypress run --config baseUrl="$BACKEND_URL" || true

      - name: Upload Cypress artifacts
        if: ${{ env.BACKEND_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
            cypress/results
            cypress/report
          if-no-files-found: ignore

      - name: Configure AWS credentials
        if: >-
          ${{
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            env.S3_BUCKET != '' &&
            env.AWS_ACCESS_KEY_ID_VALUE != '' &&
            env.AWS_SECRET_ACCESS_KEY_VALUE != '' &&
            env.AWS_REGION_VALUE != ''
          }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID_VALUE }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY_VALUE }}
          aws-region: ${{ env.AWS_REGION_VALUE }}

      - name: Sync frontend build to S3
        if: >-
          ${{
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            env.S3_BUCKET != '' &&
            env.AWS_ACCESS_KEY_ID_VALUE != '' &&
            env.AWS_SECRET_ACCESS_KEY_VALUE != '' &&
            env.AWS_REGION_VALUE != ''
          }}
        shell: bash
        run: |
          aws s3 sync \
            dist \
            "s3://$S3_BUCKET" \
            --delete \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable"

          # Ensure index.html is not aggressively cached.
          aws s3 cp \
            dist/index.html \
            "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --acl public-read

      - name: Invalidate CloudFront cache
        if: >-
          ${{
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            env.CLOUDFRONT_DISTRIBUTION_ID != '' &&
            env.AWS_ACCESS_KEY_ID_VALUE != '' &&
            env.AWS_SECRET_ACCESS_KEY_VALUE != '' &&
            env.AWS_REGION_VALUE != ''
          }}
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"