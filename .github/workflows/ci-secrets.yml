name: CI — Inject Secrets and Deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'geezle-backend/docs/**'

  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'geezle-backend/docs/**'

  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Explicitly authorize production backend deployment'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Common secrets added here for convenience.
  # Prefer scoping secrets to individual jobs/steps where practical.
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CURRENCY_API_KEY: ${{ secrets.CURRENCY_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd geezle-backend
          npm ci

      - name: Build (if present)
        shell: bash
        env:
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
        run: |
          set -euo pipefail

          cd geezle-backend

          # Ordinary CI compilation must not require a live production
          # backend endpoint. Use a deliberately inert fallback when no
          # backend URL is configured.
          #
          # An explicitly authorized production deployment must fail closed
          # instead of producing an artifact with the inert placeholder.
          if [ -z "$VITE_BACKEND_URL" ] && [ -z "$BACKEND_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${DEPLOY_PRODUCTION:-false}" = "true" ]; then
              echo "::error::BACKEND_URL must be configured before an authorized production deployment."
              exit 1
            fi

            export VITE_BACKEND_URL="https://backend.invalid"
            export BACKEND_URL="https://backend.invalid"
          else
            export VITE_BACKEND_URL="${VITE_BACKEND_URL:-$BACKEND_URL}"
            export BACKEND_URL="${BACKEND_URL:-$VITE_BACKEND_URL}"
          fi

          npm run build --if-present

      - name: Run tests (if present)
        run: |
          cd geezle-backend
          npm run test --if-present

      - name: Print selected config (non-sensitive)
        shell: bash
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
        run: |
          echo "STORAGE_DRIVER=${STORAGE_DRIVER:-local}"

          if [ -n "$EMAIL_HOST" ]; then
            echo "EMAIL_HOST=configured"
          else
            echo "EMAIL_HOST=not-configured"
          fi

  deploy:
    name: Deploy to production (manual authorization required)
    needs: build
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.deploy_production == true
      }}

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          missing=0

          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::DEPLOY_USER is not configured."
            missing=1
          fi

          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_HOST is not configured."
            missing=1
          fi

          if [ -z "$DEPLOY_PATH" ]; then
            echo "::error::DEPLOY_PATH is not configured."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Production deployment configuration is present."

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Rsync and restart on remote
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          rsync -avz \
            --delete \
            --exclude='.git' \
            ./geezle-backend/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && npm ci --omit=dev && (pm2 restart geezle || pm2 start npm --name geezle -- start)"
