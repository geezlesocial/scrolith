name: CI — Inject Secrets and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'geezle-backend/docs/**'
  workflow_dispatch:

env:
  # Common secrets added here for convenience; prefer using secrets in job scope where needed.
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CURRENCY_API_KEY: ${{ secrets.CURRENCY_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd geezle-backend
          npm ci

      - name: Build (if present)
        run: |
          cd geezle-backend
          npm run build --if-present

      - name: Run tests (if present)
        run: |
          cd geezle-backend
          npm test || true

      - name: Print selected config (non-sensitive)
        run: |
          echo "STORAGE_DRIVER=${STORAGE_DRIVER:-local}"
          echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}"

  deploy:
    name: Deploy to production (protected branch)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.get_url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Rsync and restart on remote
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete --exclude='.git' ./geezle-backend/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/
          ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && npm ci --production && pm2 restart geezle || pm2 start npm --name geezle -- start"

