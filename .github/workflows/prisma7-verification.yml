name: Prisma 7 Verification

on:
  push:
    branches:
      - codex/staging-redis-remediation-20260917
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: geezle-backend
    env:
      DATABASE_URL: postgresql://scrolith_test:local_test_password@127.0.0.1:5432/scrolith_test
      SHADOW_DATABASE_URL: postgresql://scrolith_test:local_test_password@127.0.0.1:5432/scrolith_shadow
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_TEST_MODE: local
      REDIS_RATE_LIMIT_FAIL_CLOSED: 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scrolith_test
          POSTGRES_PASSWORD: local_test_password
          POSTGRES_DB: scrolith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scrolith_test -d scrolith_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize repository submodules for cross-tree certification tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git -C "$GITHUB_WORKSPACE" config -f "$GITHUB_WORKSPACE/.gitmodules" submodule.geezle.url https://github.com/geezlesocial/scrolith.git
          git -C "$GITHUB_WORKSPACE" submodule sync --recursive
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C "$GITHUB_WORKSPACE" -c "http.https://github.com/.extraheader=$auth_header" submodule update --init --recursive

      - name: Use Node.js 22.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: geezle-backend/package-lock.json

      - name: Create isolated shadow database
        env:
          PGPASSWORD: local_test_password
        run: |
          psql --host=127.0.0.1 --username=scrolith_test --dbname=postgres --command="CREATE DATABASE scrolith_shadow OWNER scrolith_test;"

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Prisma isolated migration verification
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --script

      - name: Seed deterministic CI fixtures
        env:
          NODE_ENV: test
          APP_RUNTIME: test
          DISABLE_BACKGROUND_WORKERS: 'true'
          TEST_DB_KIND: cloudbuild-postgres
          TEST_DB_PROJECT: cloudbuild-ephemeral
          TEST_DB_INSTANCE: cloudbuild-ephemeral-postgres-test
          TEST_DB_NAME: scrolith_test
        run: npm run test:db:seed

      - name: Node contract suites
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_TEST_TIMEOUT_MS: '120000'
          TEST_DB_KIND: cloudbuild-postgres
          TEST_DB_PROJECT: cloudbuild-ephemeral
          TEST_DB_INSTANCE: cloudbuild-ephemeral-postgres-test
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_TEST_MODE: local
          REDIS_RATE_LIMIT_FAIL_CLOSED: 'true'
        run: node scripts/run-node-test-files.mjs

      - name: Jest regression suites
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_TEST_TIMEOUT_MS: '120000'
          JEST_TEST_TIMEOUT_MS: '60000'
          JEST_GROUP_TIMEOUT_MS: '900000'
          JEST_GROUP_SIZE: '12'
          TEST_DB_KIND: cloudbuild-postgres
          TEST_DB_PROJECT: cloudbuild-ephemeral
          TEST_DB_INSTANCE: cloudbuild-ephemeral-postgres-test
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_TEST_MODE: local
          REDIS_RATE_LIMIT_FAIL_CLOSED: 'true'
        run: npm run test:full

      - name: TypeScript build
        run: npm run build

      - name: Check patch formatting
        run: git diff --check

      - name: Clean backend Docker build
        run: docker build --file Dockerfile.acr.temp --tag scrolith-backend:prisma7-ci .

      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-production.json || true
          node -e "const r=require('./audit-production.json'); console.log(JSON.stringify(r.metadata?.vulnerabilities||{}))"

      - name: Full dependency audit
        shell: bash
        run: |
          npm audit --json > audit-full.json || true
          node -e "const r=require('./audit-full.json'); console.log(JSON.stringify(r.metadata?.vulnerabilities||{}))"

      - name: Remove audit artifacts
        if: always()
        run: rm -f audit-production.json audit-full.json
