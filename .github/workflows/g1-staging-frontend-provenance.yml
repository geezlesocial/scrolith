name: G1 Staging Frontend Image Provenance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: g1-staging-frontend-image
  cancel-in-progress: false

jobs:
  build-sign-and-record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: g1-staging-artifact
    env:
      ACR_NAME: acrscrolithstaging8098
      ACR_LOGIN_SERVER: acrscrolithstaging8098.azurecr.io
      IMAGE_REPOSITORY: scrolith-frontend
      DOCKERFILE: Dockerfile.staging

    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify source and protected staging build input
        id: source
        shell: bash
        env:
          STAGING_API_ORIGIN: ${{ secrets.G1_STAGING_API_CANDIDATE_ORIGIN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$DOCKERFILE"
          test -f nginx.staging.conf.template
          test -n "$STAGING_API_ORIGIN"
          node --input-type=module -e 'import { validateStagingApiOrigin } from "./scripts/stagingFrontendConfig.mjs"; validateStagingApiOrigin(process.env.STAGING_API_ORIGIN)'
          printf 'BUILD_STARTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Verify Azure OIDC configuration is present
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        shell: bash
        run: az acr login --name "$ACR_NAME"

      - name: Build and push one staging frontend image
        id: image
        shell: bash
        env:
          STAGING_API_ORIGIN: ${{ secrets.G1_STAGING_API_CANDIDATE_ORIGIN }}
        run: |
          set -euo pipefail
          image_uri="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY"
          short_sha="$(printf '%.12s' "$GITHUB_SHA")"
          image_tag="g1-frontend-$short_sha-$GITHUB_RUN_ID"
          image_ref="$image_uri:$image_tag"
          existing_tag="$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_REPOSITORY" \
            --query "[?name=='$image_tag'].name | [0]" -o tsv)"
          test -z "$existing_tag"
          dockerfile_sha="$(sha256sum "$DOCKERFILE" | awk '{print $1}')"
          nginx_template_sha="$(sha256sum nginx.staging.conf.template | awk '{print $1}')"
          build_log="$(mktemp "$RUNNER_TEMP/g1-frontend-build.XXXXXX.log")"
          trap 'rm -f "$build_log"' EXIT
          if ! docker buildx build \
            --file "$DOCKERFILE" \
            --platform linux/amd64 \
            --secret id=staging_api_origin,env=STAGING_API_ORIGIN \
            --build-arg "SOURCE_REPOSITORY=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --build-arg "DOCKERFILE_SHA256=$dockerfile_sha" \
            --build-arg "STAGING_NGINX_TEMPLATE_SHA256=$nginx_template_sha" \
            --tag "$image_ref" \
            --provenance=false \
            --sbom=false \
            --push \
            . >"$build_log" 2>&1; then
            echo 'Staging frontend build failed; detailed output was withheld to protect restricted build input.' >&2
            exit 1
          fi
          rm -f "$build_log"
          trap - EXIT
          image_digest="$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_REPOSITORY" \
            --detail \
            --query "[?name=='$image_tag'].digest | [0]" -o tsv)"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "::add-mask::$image_digest"
          manifest_count="$(az acr manifest list-metadata \
            --registry "$ACR_LOGIN_SERVER" \
            --name "$IMAGE_REPOSITORY" \
            --query "[?digest=='$image_digest'] | length(@)" -o tsv)"
          test "$manifest_count" = '1'
          pushed_ref="$image_uri@$image_digest"
          docker pull "$pushed_ref" >/dev/null
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$pushed_ref")" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$pushed_ref")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.dockerfile"}}' "$pushed_ref")" = "$DOCKERFILE"
          test "$(docker image inspect --format '{{index .Config.Labels "com.scrolith.dockerfile.sha256"}}' "$pushed_ref")" = "$dockerfile_sha"
          test "$(docker image inspect --format '{{index .Config.Labels "com.scrolith.staging-nginx-template.sha256"}}' "$pushed_ref")" = "$nginx_template_sha"
          printf 'IMAGE_URI=%s\n' "$image_uri" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_TAG=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_DIGEST=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
          printf 'PUSHED_REF=%s\n' "$pushed_ref" >> "$GITHUB_OUTPUT"
          printf 'DOCKERFILE_SHA256=%s\n' "$dockerfile_sha" >> "$GITHUB_OUTPUT"
          printf 'STAGING_NGINX_TEMPLATE_SHA256=%s\n' "$nginx_template_sha" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM for the immutable image digest
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.24.0
        with:
          image: ${{ steps.image.outputs.PUSHED_REF }}
          format: cyclonedx-json
          output-file: g1-frontend-sbom.cdx.json
          artifact-name: g1-frontend-sbom
          syft-version: v1.18.1
          upload-artifact: 'false'

      - name: Record digest-bound provenance
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.IMAGE_URI }}
          IMAGE_TAG: ${{ steps.image.outputs.IMAGE_TAG }}
          IMAGE_DIGEST: ${{ steps.image.outputs.IMAGE_DIGEST }}
          DOCKERFILE_SHA256: ${{ steps.image.outputs.DOCKERFILE_SHA256 }}
          STAGING_NGINX_TEMPLATE_SHA256: ${{ steps.image.outputs.STAGING_NGINX_TEMPLATE_SHA256 }}
          BUILD_STARTED_AT: ${{ steps.source.outputs.BUILD_STARTED_AT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$IMAGE_DIGEST"
          sha256sum g1-frontend-sbom.cdx.json > g1-frontend-sbom.cdx.sha256
          jq -n \
            --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg dockerfile "$DOCKERFILE" \
            --arg dockerfileSha "$DOCKERFILE_SHA256" \
            --arg nginxTemplateSha "$STAGING_NGINX_TEMPLATE_SHA256" \
            --arg image "$IMAGE_URI" \
            --arg imageTag "$IMAGE_TAG" \
            --arg digest "$IMAGE_DIGEST" \
            --arg builder "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/g1-staging-frontend-provenance.yml@refs/heads/main" \
            --arg invocation "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg started "$BUILD_STARTED_AT" \
            --arg finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{_type:"https://in-toto.io/Statement/v0.1",subject:[{name:$image,digest:{sha256:($digest|sub("^sha256:";""))}}],predicateType:"https://slsa.dev/provenance/v0.2",predicate:{builder:{id:$builder},buildType:"https://github.com/actions/runner",invocation:{configSource:{uri:$repository,digest:{gitCommit:$sourceCommit},entryPoint:$dockerfile},parameters:{branch:$branch,sourceCommit:$sourceCommit,dockerfile:$dockerfile,dockerfileSha256:$dockerfileSha,nginxCspTemplateSha256:$nginxTemplateSha,imageTag:$imageTag,invocationId:$invocation}},buildConfig:{repository:$repository,branch:$branch,sourceCommit:$sourceCommit,dockerfile:$dockerfile,imageTag:$imageTag},metadata:{buildStartedOn:$started,buildFinishedOn:$finished,invocationId:$invocation},materials:[{uri:$repository,digest:{gitCommit:$sourceCommit}},{uri:("git+"+$repository+"/"+$dockerfile),digest:{sha256:$dockerfileSha}},{uri:("git+"+$repository+"/nginx.staging.conf.template"),digest:{sha256:$nginxTemplateSha}}]}}' \
            > g1-frontend-provenance.json
          jq -e '
            ._type == "https://in-toto.io/Statement/v0.1" and
            .predicateType == "https://slsa.dev/provenance/v0.2" and
            (.predicate.builder.id | type == "string" and length > 0) and
            (.subject | length == 1) and
            (.subject[0].digest.sha256 | type == "string" and length == 64)
          ' g1-frontend-provenance.json >/dev/null

      - name: Install Cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0

      - name: Sign and verify provenance for the immutable digest
        shell: bash
        env:
          COSIGN_YES: 'true'
          IMAGE_REF: ${{ steps.image.outputs.PUSHED_REF }}
        run: |
          set -euo pipefail
          cosign attest --yes \
            --predicate g1-frontend-provenance.json \
            --type https://slsa.dev/provenance/v0.2 \
            "$IMAGE_REF"
          identity_regexp="^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/g1-staging-frontend-provenance\\.yml@refs/heads/main$"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity_regexp" \
            "$IMAGE_REF" > g1-frontend-provenance-verification.json

      - name: Upload immutable frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-frontend-provenance-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            g1-frontend-sbom.cdx.json
            g1-frontend-sbom.cdx.sha256
            g1-frontend-provenance.json
            g1-frontend-provenance-verification.json
