name: CMS Sanity

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  NODE_ENV: test
  VITE_API_URL: http://localhost:5000/api

jobs:
  cms-sanity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo
    steps:
      - name: Download repository archive
        run: |
          echo "Downloading repo archive for ${{ github.sha }}"
          mkdir repo
          curl -L -o repo.tar.gz "https://codeload.github.com/${{ github.repository }}/tar.gz/${{ github.sha }}"
          tar -xzf repo.tar.gz -C repo --strip-components=1
          ls -la repo | sed -n '1,200p'
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CMS sanity script (direct)
        run: node ./scripts/cms_sanity.cjs
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          NODE_ENV: ${{ env.NODE_ENV }}
