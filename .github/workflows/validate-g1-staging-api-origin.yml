name: Validate G1 Staging API Origin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-origin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: g1-staging-artifact
    env:
      CANDIDATE_ORIGIN: ${{ secrets.G1_STAGING_API_CANDIDATE_ORIGIN }}
    steps:
      - name: Compare protected origin fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256='fe5cc55324c1c9fcf38f7367e8b2c52b62e6460f9b0e7d86d5e960863208b1ca'

          if [[ -z "${CANDIDATE_ORIGIN:-}" ]]; then
            echo 'FAIL'
            exit 1
          fi

          actual_sha256="$(printf '%s' "$CANDIDATE_ORIGIN" | sha256sum | cut -d' ' -f1)" || {
            echo 'FAIL'
            exit 1
          }

          if [[ "$actual_sha256" == "$expected_sha256" ]]; then
            echo 'PASS'
          else
            echo 'FAIL'
            exit 1
          fi
