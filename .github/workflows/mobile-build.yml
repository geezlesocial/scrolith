name: Mobile Build

on:
  workflow_dispatch:

jobs:
  android:
    if: ${{ hashFiles('mobile/android/**') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Web Dependencies
        working-directory: geezle
        run: npm install
      - name: Build Web
        working-directory: geezle
        run: npm run build
      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android
      - name: Build Android AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease

  ios:
    if: ${{ hashFiles('mobile/ios/**') != '' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Web Dependencies
        working-directory: geezle
        run: npm install
      - name: Build Web
        working-directory: geezle
        run: npm run build
      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync ios
      - name: Xcode Build
        working-directory: mobile/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination generic/platform=iOS
