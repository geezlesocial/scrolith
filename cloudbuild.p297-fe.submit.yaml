# Phase 29.7 — Enterprise Messaging Groups + mobile privacy fix frontend
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        --no-cache,
        -t,
        asia-southeast1-docker.pkg.dev/scrolith-500821/scrolith/scrolith-frontend:p297,
        --build-arg,
        VITE_API_URL=https://api.scrolith.com/api,
        --build-arg,
        VITE_BACKEND_URL=https://api.scrolith.com,
        --build-arg,
        VITE_PUBLIC_APP_DOMAIN=scrolith.com,
        --build-arg,
        VITE_PUBLIC_APP_URL=https://scrolith.com,
        --label,
        phase=29.7,
        --label,
        feature=messaging-privacy-mobile-fix,
        .
      ]
images:
  - asia-southeast1-docker.pkg.dev/scrolith-500821/scrolith/scrolith-frontend:p297
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 2400s
