openapi: 3.0.3
info:
  title: Scrolith Dashboard API (subset)
  version: 1.0.0
servers:
  - url: /api
paths:
  /freelancer/overview:
    get:
      summary: Freelancer dashboard overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Overview payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreelancerOverviewResponse'
  /gigs:
    get:
      summary: List gigs (owner=me)
      parameters:
        - in: query
          name: ownerId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Gigs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Gig'
  /orders:
    get:
      summary: List orders
      parameters:
        - in: query
          name: role
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
  /wallet/me:
    get:
      summary: Get wallet for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
  /admin/analytics/activity:
    get:
      summary: Admin activity metrics
      parameters:
        - in: query
          name: range
          schema:
            type: string
      responses:
        '200':
          description: Activity array
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        messages:
                          type: integer
                        newUsers:
                          type: integer
                        orders:
                          type: integer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FreelancerOverviewResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            activeOrders:
              type: integer
            revisionOrders:
              type: integer
            earningsThisMonth:
              type: number
            walletBalance:
              type: number
            gigViews:
              type: integer
            gigClicks:
              type: integer
            rating:
              type: number
            reviews:
              type: integer
            unreadMessages:
              type: integer
            unreadNotifications:
              type: integer
    Gig:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        price:
          type: number
        views:
          type: integer
        clicks:
          type: integer
    Order:
      type: object
      properties:
        id:
          type: string
        gigId:
          type: string
        clientId:
          type: string
        freelancerId:
          type: string
        amount:
          type: number
        status:
          type: string
    WalletResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            balances:
              type: object
              properties:
                available:
                  type: number
                pendingClearance:
                  type: number
                escrowHeld:
                  type: number
                total:
                  type: number
            transactions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  amount:
                    type: number
                  status:
                    type: string
