map $http_accept_encoding $scrolith_static_suffix {
  default "";
  "~*br" ".br";
  "~*gzip" ".gz";
}

map $scrolith_static_suffix $scrolith_static_encoding {
  default "";
  ".br" "br";
  ".gz" "gzip";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep immutable assets hot in the Nginx worker and use kernel-assisted
  # delivery where Container Apps permits it. This reduces per-request file
  # overhead without changing response bytes, compression, or cache semantics.
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  open_file_cache max=10000 inactive=60s;
  open_file_cache_valid 120s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/xml+rss
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject
    application/font-woff
    application/font-woff2
    font/woff
    font/woff2;

  # Enterprise security headers (additive; HSTS typically terminated at load balancer).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # HTML is revalidated, but may still use a precompressed sidecar.
  location = /index.html {
    try_files $uri$scrolith_static_suffix $uri =404;
    gzip off;
    default_type text/html;
    add_header Content-Encoding $scrolith_static_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Precompressed text assets avoid runtime compression CPU and preserve the
  # existing immutable policy for content-hashed filenames.
  location ~* \.(js|mjs)$ {
    try_files $uri$scrolith_static_suffix $uri @static_missing;
    gzip off;
    default_type application/javascript;
    add_header Content-Encoding $scrolith_static_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* \.css$ {
    try_files $uri$scrolith_static_suffix $uri @static_missing;
    gzip off;
    default_type text/css;
    add_header Content-Encoding $scrolith_static_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* \.json$ {
    try_files $uri$scrolith_static_suffix $uri @static_missing;
    gzip off;
    default_type application/json;
    add_header Content-Encoding $scrolith_static_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* \.svg$ {
    try_files $uri$scrolith_static_suffix $uri @static_missing;
    gzip off;
    default_type image/svg+xml;
    add_header Content-Encoding $scrolith_static_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* \.txt$ {
    try_files $uri$scrolith_static_suffix $uri @static_missing;
    gzip off;
    default_type text/plain;
    add_header Content-Encoding $scrolith_static_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* \.wasm$ {
    try_files $uri$scrolith_static_suffix $uri @static_missing;
    gzip off;
    default_type application/wasm;
    add_header Content-Encoding $scrolith_static_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* \.xml$ {
    try_files $uri$scrolith_static_suffix $uri @static_missing;
    gzip off;
    default_type application/xml;
    add_header Content-Encoding $scrolith_static_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Hashed static assets: long-cache ONLY on successful 200 responses.
  # Critical: never attach immutable cache headers to 404 — during multi-revision
  # canaries browsers can poison-cache missing hashes for up to 1 year.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|otf)$ {
    try_files $uri @static_missing;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location @static_missing {
    default_type text/plain;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404 "Not Found\n";
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.linkedin.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.scrolith.com https://*.scrolith.com wss://api.scrolith.com wss://*.scrolith.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.googleapis.com https://*.linkedin.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.linkedin.com; form-action 'self' https://accounts.google.com https://*.linkedin.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
    try_files $uri $uri/ /index.html;
  }
}
