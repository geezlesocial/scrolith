map $http_accept_encoding $scrolith_static_suffix {
  default "";
  "~*br" ".br";
  "~*gzip" ".gz";
}

map $scrolith_static_suffix $scrolith_static_encoding {
  default "";
  ".br" "br";
  ".gz" "gzip";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/xml+rss
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject
    application/font-woff
    application/font-woff2
    font/woff
    font/woff2;

  # Enterprise security headers (additive; HSTS typically terminated at load balancer).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # HTML is revalidated, but may still use a precompressed sidecar.
  location = /index.html {
    try_files $uri$scrolith_static_suffix $uri =404;
    gzip off;
    add_header Content-Encoding $scrolith_static_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Precompressed text assets avoid runtime compression CPU and preserve the
  # existing immutable policy for content-hashed filenames.
  location ~* \.(js|css|html|json|mjs|svg|txt|wasm|xml)$ {
    try_files $uri$scrolith_static_suffix $uri @static_missing;
    gzip off;
    add_header Content-Encoding $scrolith_static_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Hashed static assets: long-cache ONLY on successful 200 responses.
  # Critical: never attach immutable cache headers to 404 — during multi-revision
  # canaries browsers can poison-cache missing hashes for up to 1 year.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|otf)$ {
    try_files $uri @static_missing;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location @static_missing {
    default_type text/plain;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404 "Not Found\n";
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
    try_files $uri $uri/ /index.html;
  }
}
