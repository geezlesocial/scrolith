server {
  listen 8080;
  server_name www.scrolith.com;
  return 308 https://scrolith.com$request_uri;
}

server {
  listen 8080 default_server;
  server_name scrolith.com _;
  etag on;

  # Keep origin delivery efficient for Front Door misses and direct clients.
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  keepalive_requests 1000;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject
    application/font-woff
    application/font-woff2;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-DNS-Prefetch-Control "on" always;
    add_header Link "<https://api.scrolith.com>; rel=preconnect, <https://api.scrolith.com>; rel=dns-prefetch" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-DNS-Prefetch-Control "on" always;
    add_header Link "<https://api.scrolith.com>; rel=preconnect, <https://api.scrolith.com>; rel=dns-prefetch" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|ico|mp4|webm|m4v|ogg|mp3|aac|woff|woff2|ttf)$ {
    expires off;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    try_files $uri =404;
  }
}
